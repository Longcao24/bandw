<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Học BandW · BandW KHKT</title>
  <meta name="description" content="Giáo trình trực quan cho đội thi KHKT: hiểu dự án vòng tay BandW từ cảm biến trên cổ tay đến câu nói trên điện thoại.">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/exercises.css">
  <link rel="stylesheet" href="css/sims.css">
  <link rel="stylesheet" href="css/exam.css">
  <link rel="stylesheet" href="css/grading.css">
  <link rel="stylesheet" href="css/question.css">
  <link rel="modulepreload" href="js/app.js">
</head>
<body>
  <a class="skip-link" href="#app">Bỏ qua đến nội dung</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#/" aria-label="BandW · Ôn KHKT, về trang chủ">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26"><rect x="3" y="9" width="26" height="14" rx="7" fill="var(--c-primary)"/><rect x="11" y="11" width="10" height="10" rx="3" fill="var(--c-surface)"/><circle cx="16" cy="16" r="2.4" fill="var(--c-primary)"/></svg>
        </span>
        <span class="logo-text">BandW <span class="logo-sub">Ôn KHKT</span></span>
      </a>
      <nav class="main-nav" aria-label="Điều hướng chính">
        <a class="nav-link" href="#/" data-nav="learn">Học</a>
        <a class="nav-link" href="#/question" data-nav="question">Câu hỏi</a>
        <a class="nav-link" href="#/exam" data-nav="exam">Thi thử</a>
      </nav>
      <div class="header-right">
        <div class="hdr-progress" role="group" aria-label="Thành tích">
          <span class="hstat energy" id="hdr-points" title="Điểm năng lượng"><i data-icon="zap"></i><span class="v">0</span></span>
          <span class="hstat streak" id="hdr-streak" title="Chuỗi ngày học"><i data-icon="flame"></i><span class="v">0</span></span>
        </div>
        <div class="user-menu">
          <button class="user-menu-btn" type="button" aria-expanded="false" aria-controls="user-menu" aria-label="Hồ sơ học tập và trạng thái lưu">
            <i data-icon="user"></i><span class="sync-dot" id="hdr-sync-dot" data-status="idle" aria-hidden="true"></span>
          </button>
          <div class="user-menu-pop" id="user-menu" hidden>
            <div class="um-head">
              <span class="um-label">Mã học tập</span>
              <code class="um-code" id="hdr-code"></code>
              <a class="sync-pill hdr" id="hdr-sync" href="#/profile"><span class="i sync-dot" aria-hidden="true"></span><span class="t">Đã lưu</span></a>
            </div>
            <ul class="um-links">
              <li><a href="#/profile"><i data-icon="settings"></i>Hồ sơ &amp; cài đặt</a></li>
              <li><a href="#/practice"><i data-icon="mic"></i>Luyện phản biện</a></li>
              <li><a href="#/videos"><i data-icon="video"></i>Thư viện video</a></li>
              <li><a href="#/glossary"><i data-icon="book"></i>Thuật ngữ</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main id="app" tabindex="-1">
    <div class="boot" role="status"><span class="spinner" aria-hidden="true"></span> Đang tải giáo trình…</div>
  </main>
  <footer class="site-footer">
    <p>BandW · Vòng tay hỗ trợ giao tiếp · Tài liệu ôn tập KHKT · Tiến độ chỉ lưu theo mã học tập ẩn danh.</p>
  </footer>
  <nav class="tabbar" aria-label="Điều hướng nhanh">
    <a href="#/" data-nav="learn"><i data-icon="learn"></i><span>Học</span></a>
    <a href="#/question" data-nav="question"><i data-icon="question"></i><span>Câu hỏi</span></a>
    <a href="#/exam" data-nav="exam"><i data-icon="exam"></i><span>Thi thử</span></a>
    <a href="#/profile" data-nav="profile"><i data-icon="user"></i><span>Hồ sơ</span></a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="page narrow">Trang này cần bật JavaScript để chạy các hoạt hình và bài tập.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
