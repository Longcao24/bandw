<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Học BandW · BandW KHKT</title>
  <meta name="description" content="Giáo trình trực quan cho đội thi KHKT: hiểu dự án vòng tay BandW từ cảm biến trên cổ tay đến câu nói trên điện thoại.">
  <meta name="theme-color" content="#1865f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/exercises.css">
  <link rel="stylesheet" href="css/sims.css">
  <link rel="stylesheet" href="css/exam.css">
  <link rel="stylesheet" href="css/grading.css">
  <link rel="stylesheet" href="css/question.css">
  <link rel="modulepreload" href="js/app.js">
</head>
<body>
  <a class="skip-link" href="#app">Bỏ qua đến nội dung</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#/" aria-label="BandW · Ôn KHKT, về trang chủ">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><rect x="3" y="9" width="26" height="14" rx="7" fill="var(--c-primary)"/><rect x="11" y="11" width="10" height="10" rx="3" fill="var(--c-surface)"/><circle cx="16" cy="16" r="2.4" fill="var(--c-primary)"/></svg>
        </span>
        <span class="logo-text">BandW <span class="logo-dot">·</span> <span class="logo-sub">Ôn KHKT</span></span>
      </a>
      <nav class="header-stats" aria-label="Thành tích và lối tắt">
        <a class="hdr-exam hdr-q" href="#/question" aria-label="Câu hỏi phản biện" title="Câu hỏi phản biện"><span aria-hidden="true">🎤</span><span class="t">Câu hỏi</span></a>
        <a class="hdr-exam" href="#/exam" aria-label="Thi thử" title="Thi thử"><span aria-hidden="true">📝</span><span class="t">Thi thử</span></a>
        <span class="hstat energy" id="hdr-points" title="Điểm năng lượng"><span aria-hidden="true">⚡</span><span class="v">0</span></span>
        <span class="hstat streak" id="hdr-streak" title="Chuỗi ngày học"><span aria-hidden="true">🔥</span><span class="v">0</span></span>
        <a class="sync-pill hdr" id="hdr-sync" href="#/profile"><span class="i" aria-hidden="true">☁️</span><span class="t">Đã lưu</span></a>
        <a class="avatar" href="#/profile" aria-label="Hồ sơ học tập" title="Hồ sơ học tập"><span aria-hidden="true">👤</span></a>
      </nav>
    </div>
  </header>
  <main id="app" tabindex="-1">
    <div class="boot" role="status"><span class="spinner" aria-hidden="true"></span> Đang tải giáo trình…</div>
  </main>
  <footer class="site-footer">
    <p>BandW · Vòng tay hỗ trợ giao tiếp · Tài liệu ôn tập KHKT. Tiến độ chỉ lưu theo mã học tập ẩn danh.</p>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="page narrow">Trang này cần bật JavaScript để chạy các hoạt hình và bài tập.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
